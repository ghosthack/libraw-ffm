name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version to build the dry-run bundle as (not committed)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Cannot release snapshot version $VERSION"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG must match project version v$VERSION"
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/download-artifact@v4
        with:
          name: natives-macos-arm64
          path: natives/src/main/resources/libraw-natives/macos-arm64/

      - uses: actions/download-artifact@v4
        with:
          name: natives-windows-x64
          path: natives/src/main/resources/libraw-natives/windows-x64/

      - uses: actions/download-artifact@v4
        with:
          name: natives-linux-x64
          path: natives/src/main/resources/libraw-natives/linux-x64/

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy to Maven Central
        # Tests already ran against real natives on the platform jobs.
        # Pinning the classifier prevents the Linux profile from replacing
        # the macOS classifier in the all-natives deployment.
        run: ./mvnw -B clean deploy -P release,all-natives -Dnative.classifier=macos-arm64 -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Manual runs only build and sign the Central bundle (never uploaded) so it
  # can be inspected and validated without publishing. The job only gets
  # placeholder Central credentials, so it cannot upload anything.
  dry-run-build:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  bundle-dry-run:
    needs: dry-run-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: natives-macos-arm64
          path: natives/src/main/resources/libraw-natives/macos-arm64/

      - uses: actions/download-artifact@v4
        with:
          name: natives-windows-x64
          path: natives/src/main/resources/libraw-natives/windows-x64/

      - uses: actions/download-artifact@v4
        with:
          name: natives-linux-x64
          path: natives/src/main/resources/libraw-natives/linux-x64/

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Build Central bundle without publishing
        run: |
          ./mvnw -v
          if [[ -n "$DRY_RUN_VERSION" ]]; then
            ./mvnw -B -q versions:set -DnewVersion="$DRY_RUN_VERSION" -DgenerateBackupPoms=false
          fi
          # skipPublishing would also skip bundling, so let the upload fail
          # against an unreachable URL instead and keep the bundle it built.
          ./mvnw -B clean deploy -P release,all-natives -Dnative.classifier=macos-arm64 -DskipTests -DcentralBaseUrl=http://127.0.0.1:9 || true
          test -f target/central-publishing/central-bundle.zip
          unzip -l target/central-publishing/central-bundle.zip
          if unzip -Z1 target/central-publishing/central-bundle.zip | grep -E '(_remote\.repositories|maven-metadata-local\.xml)'; then
            echo "::error::Bundle contains local-repository metadata that Central rejects"
            exit 1
          fi
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
          MAVEN_CENTRAL_USERNAME: dry-run
          MAVEN_CENTRAL_PASSWORD: dry-run
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
